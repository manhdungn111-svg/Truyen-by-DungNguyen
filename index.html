<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quýt Truyện</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quýt Truyện">
<meta name="theme-color" content="#ff5a1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#0e0e10;--surface:#19191c;--surface2:#232327;--fg:#f4f2ef;--muted:#9b9aa3;
  --accent:#ff5a1f;--accent-fg:#fff;--line:#2b2b30;--scrim:rgba(14,14,16,.88);--err:#ff6b5e;--ok:#4cc38a;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#faf7f4;--surface:#fff;--surface2:#efe9e3;--fg:#1b1a19;--muted:#6f6a66;--accent:#e8470f;--line:#e5ded7;--scrim:rgba(250,247,244,.9);--err:#c62828;--ok:#1f8a58;color-scheme:light}}
:root[data-theme="light"]{--bg:#faf7f4;--surface:#fff;--surface2:#efe9e3;--fg:#1b1a19;--muted:#6f6a66;--accent:#e8470f;--line:#e5ded7;--scrim:rgba(250,247,244,.9);--err:#c62828;--ok:#1f8a58;color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.45;color:var(--fg);-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{display:block}
.g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.brand{display:flex;align-items:center;gap:10px;padding-block:14px 12px}
.brand svg{width:34px;height:34px}
.brand b{font-size:24px;font-weight:800;letter-spacing:-.03em}
.brand b i{font-style:normal;color:var(--accent)}
.lang{background:var(--surface2);border:0;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;appearance:none;-webkit-appearance:none}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));max-width:1100px;margin-inline:auto}
.sec{padding-top:22px}
.sec h3{margin:0 0 14px;font-size:22px;font-weight:700;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.sec h3::before{content:"";width:12px;height:12px;border-radius:50% 50% 50% 0;background:linear-gradient(135deg,#ff9a3c,var(--accent));transform:rotate(-20deg) translateY(-6px)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 10px}
@media (min-width:700px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.tiles{grid-template-columns:repeat(4,minmax(0,1fr))!important}}
.card{display:block;text-align:left;min-width:0;width:100%}
.thumb{position:relative;border-radius:10px;overflow:hidden;background:var(--surface2);aspect-ratio:3/4}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .t{margin-top:8px;font-weight:600;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .s{margin-top:2px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk{background:linear-gradient(100deg,var(--surface2) 30%,var(--surface) 50%,var(--surface2) 70%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:10px;aspect-ratio:3/4}
@keyframes sh{to{background-position:-200% 0}}
.msg{padding:28px 0;text-align:center;color:var(--muted)}
.msg.err{color:var(--err)}
.btn{padding:13px;border-radius:12px;font-weight:700;text-align:center;background:var(--surface2);flex:1;min-width:0}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.on{background:var(--surface2);color:var(--accent)}
.btn[disabled]{opacity:.35;cursor:default}
.sbar{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:999px;padding:0 16px;margin-top:6px}
.sbar svg{width:20px;height:20px;flex:none;color:var(--muted)}
.sbar input{flex:1;min-width:0;height:46px;background:transparent;border:0;font-size:16px}
.sbar input:focus{outline:none}
.sbar:focus-within{box-shadow:0 0 0 2px var(--accent)}
.frow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sel{background:var(--surface2);color:var(--fg);border:0;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;min-width:0;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:7px 14px;border-radius:999px;background:var(--surface2);font-weight:600;font-size:13.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;overflow:hidden;border-radius:14px;aspect-ratio:16/8;text-align:left;color:#fff;padding:12px;display:flex;align-items:flex-end;font-weight:700;font-size:17px;line-height:1.2;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--surface);border-radius:14px;padding:10px}
.hmain{display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px;align-items:center;text-align:left;min-width:0}
.hmain .thumb{border-radius:8px}
.hmain h4{margin:0;font-size:16px;font-weight:700;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hmain p{margin:3px 0 0;color:var(--muted);font-size:13px}
.hmain .go{color:var(--accent);font-weight:700}
.xbtn{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.xbtn svg{width:18px;height:18px}
.list{display:grid;gap:10px;margin-top:14px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px max(4px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted);min-width:0}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.nav svg{width:25px;height:25px}
.credit{padding-block:30px;color:var(--muted);font-size:13px}
.note{color:var(--muted);font-size:13px;margin:14px 0 0;max-width:60ch}
.panel{background:var(--surface);border-radius:14px;padding:16px;margin-top:14px}
.panel b{font-size:18px}
.ok{color:var(--ok)}
.bad{color:var(--err)}
#diag div{margin:4px 0}
.banner{background:var(--surface2);color:var(--fg);border-radius:12px;margin:8px 16px;padding:12px 14px;font-size:14px}
.ov{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.ovbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;background:var(--scrim);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ovbar h2{margin:0;font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);flex:none}
.ib svg{width:22px;height:22px}
.dhead{display:grid;grid-template-columns:128px minmax(0,1fr);gap:16px;padding-top:10px}
.dhead h1{margin:0;font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.by{color:var(--muted);margin-top:6px;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.btns{display:flex;gap:10px;margin-top:20px}
.desc{margin:18px 0 0;color:var(--muted);max-width:65ch;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.desc.open{-webkit-line-clamp:unset;display:block}
.more{margin-top:6px;color:var(--accent);font-weight:600;font-size:14px}
.chl{display:grid;gap:8px;margin-top:12px;padding-bottom:40px}
.ch{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;background:var(--surface);text-align:left;width:100%}
.ch b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ch .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.ch.read b{color:var(--muted)}.ch.read .dot{background:var(--line)}
.form{display:grid;gap:16px;margin-top:14px;max-width:460px}
.fld{display:grid;gap:6px;min-width:0}
.fld label{font-weight:600;font-size:14px}
.inp{width:100%;background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
.ferr{color:var(--err);font-weight:600;font-size:14px;min-height:1.2em}
.fprog{color:var(--muted);font-size:14px}
.themebtn{margin-top:22px;width:100%;padding:14px;border-radius:12px;background:var(--surface);font-weight:600;display:flex;justify-content:space-between}
.rd{background:#09090a;color:#eee}
.rd .ovbar{background:rgba(9,9,10,.9);color:#fff}
.rd .ib{background:rgba(255,255,255,.12)}
.pages{max-width:720px;margin:0 auto;min-height:60vh}
.rimg{width:100%;height:auto;display:block;margin-bottom:3px;background:#1a1a1c;min-height:200px}
.rfoot{display:flex;gap:10px;max-width:720px;margin:0 auto;padding-block:18px calc(28px + env(safe-area-inset-bottom,0px))}
.rfoot .btn{background:rgba(255,255,255,.12);color:#fff}.rfoot .btn.pri{background:var(--accent)}
.tg{font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;white-space:nowrap}
.tg[aria-pressed="true"]{background:var(--accent)}

/* thanh dưới bo tròn kiểu iPhone */
.nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px 6px;border:1px solid var(--line);border-radius:28px;background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 8px 28px rgba(0,0,0,.28)}
.nav button{border-radius:22px}
.nav button[aria-current="page"]{background:var(--surface2)}
main{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}

/* ---------- máy tính bảng (iPad) ---------- */
@media (min-width:768px){
  body{font-size:16px}
  main{max-width:1240px}
  .g{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
  .brand{padding-block:18px 14px}
  .brand svg{width:40px;height:40px}
  .brand b{font-size:28px}
  .grid{gap:26px 18px}
  .card .t{font-size:16px}
  .card .s{font-size:14px}
  .sec h3{font-size:26px}
  .sbar input{height:52px}
  .sel,.lang{font-size:15px;padding:10px 16px}
  .chip{font-size:14.5px;padding:8px 16px}
  .tile{font-size:19px;padding:16px}
  .list{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .hmain{grid-template-columns:76px minmax(0,1fr)}
  .nav{left:auto;right:max(14px,env(safe-area-inset-right,0px));top:calc(50vh - 202px);top:calc(50svh - 202px);bottom:auto;transform:translateZ(0);width:88px;grid-template-columns:1fr;gap:6px;padding:10px 6px;border-radius:30px}
  .nav button{font-size:12px;padding:12px 0}
  .nav svg{width:27px;height:27px}
  main{width:calc(100% - 112px);margin-inline:0 auto;padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
  .ov>.g{max-width:1240px;margin-inline:auto}
  .ovbar.g{padding-inline:max(28px,calc((100% - 1184px)/2))}
  .ovbar h2{font-size:19px}
  .ib{width:44px;height:44px}
  .dhead{grid-template-columns:220px minmax(0,1fr);gap:28px;padding-top:18px}
  .dhead h1{font-size:34px}
  .by{font-size:16px}
  .tags span{font-size:13.5px;padding:4px 12px}
  .btns{max-width:460px}
  .desc{font-size:16px;-webkit-line-clamp:8;max-width:80ch}
  .chl{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .ch{padding:15px 16px}
  .pages,.rfoot{max-width:860px}
  .form{max-width:520px}
  .panel{max-width:640px}
  .themebtn{max-width:640px}
  .note{max-width:70ch}
  .banner{max-width:860px;margin-inline:auto}
}
@media (min-width:1000px){
  .grid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(5,minmax(0,1fr))!important}
  .list{grid-template-columns:repeat(3,minmax(0,1fr))}
  .chl{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (hover:hover){
  .card:hover .thumb img,.tile:hover{filter:brightness(1.08)}
  .ch:hover,.hrow:hover{background:var(--surface2)}
}

/* đọc 2 trang / khung (iPad) */
.padonly{display:none}
@media (min-width:768px){
  .padonly{display:inline-block}
  .rd .ovbar{flex-wrap:wrap}
  .rd{scroll-snap-type:y proximity;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
  .pages.two{max-width:none;width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding-inline:max(0px,env(safe-area-inset-left,0px))}
  .pages.two.rtl{direction:rtl}
  .pages.two .rimg{margin:0;height:calc(100vh - 72px - env(safe-area-inset-top,0px));height:calc(100dvh - 72px - env(safe-area-inset-top,0px));min-height:0;object-fit:contain;background:#09090a;scroll-snap-align:start}
  .pages.two .rimg.span{grid-column:1/-1}
  .pages.two .rimg.long{grid-column:1/-1;height:auto;width:100%;max-width:860px;margin-inline:auto;object-fit:initial}
}

/* thanh điều khiển dưới cùng của trình đọc (điện thoại) */
.rbot{display:none}
@media (max-width:767px){
  .rd .ovbar{display:none}
  .rd{padding-top:env(safe-area-inset-top,0px)}
  .rbot{display:flex;align-items:center;gap:8px;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:45;padding:6px;border-radius:28px;background:rgba(28,28,32,.82);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 28px rgba(0,0,0,.45);color:#fff}
  .rbot .ib{background:rgba(255,255,255,.12);width:46px;height:46px}
  .rbot .ib[disabled]{opacity:.3}
  .rbot .nx svg{transform:rotate(180deg)}
  .rbot .mid{flex:1;min-width:0;text-align:center;line-height:1.25}
  .rbot .mid b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rbot .mid small{display:block;font-size:11.5px;color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rbot .ib[aria-pressed="true"]{background:var(--accent)}
  .rd .rfoot{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}

/* iPad: 2 trang vừa trọn màn hình, mũi tên chuyển chương hai bên */
.rarrow{display:none}
@media (min-width:768px){
  .rd .ovbar{position:fixed;top:0;left:0;right:0;z-index:46;background:linear-gradient(rgba(9,9,10,.88),rgba(9,9,10,0));-webkit-backdrop-filter:none;backdrop-filter:none;transition:opacity .2s}
  .rd{scroll-padding-top:0}
  .pages.two .rimg{height:100vh;height:100dvh}
  .pages:not(.two){padding-top:68px}
  .rd.noui .ovbar,.rd.noui .rarrow{opacity:0;pointer-events:none}
  .rarrow{display:grid;place-items:center;position:fixed;top:50%;transform:translateY(-50%);z-index:46;width:58px;height:58px;border-radius:50%;color:#fff;background:rgba(28,28,32,.72);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 6px 22px rgba(0,0,0,.45);transition:opacity .2s}
  .rarrow svg{width:28px;height:28px}
  .rarrow[disabled]{opacity:.25}
  .rarrow.pv{left:max(14px,env(safe-area-inset-left,0px))}
  .rarrow.nx{right:max(14px,env(safe-area-inset-right,0px))}
  .rarrow.nx svg{transform:rotate(180deg)}
  #rd.rtl .rarrow.pv{left:auto;right:max(14px,env(safe-area-inset-right,0px))}
  #rd.rtl .rarrow.nx{right:auto;left:max(14px,env(safe-area-inset-left,0px))}
  #rd.rtl .rarrow.pv svg{transform:rotate(180deg)}
  #rd.rtl .rarrow.nx svg{transform:none}
}

.rd.noui .rbot{opacity:0;pointer-events:none;transform:translateY(24px)}
.rbot{transition:opacity .2s,transform .2s}

/* iPad xoay dọc: thanh điều hướng xuống giữa phía dưới */
@media (min-width:768px) and (orientation:portrait){
  .nav{left:50%;right:auto;top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(640px,calc(100% - 48px));grid-template-columns:repeat(5,1fr);gap:0;padding:8px;border-radius:28px}
  .nav button{padding:8px 0;font-size:12.5px}
  main{width:100%;margin-inline:auto;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
}

/* thanh điều hướng giữ nguyên một chỗ, hiện ở mọi mục trừ trình đọc */
.nav{z-index:45}
.ov.rd{z-index:60}
.ov:not(.rd){padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
@media (min-width:768px) and (orientation:portrait){.ov:not(.rd){padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}}
@media (min-width:768px) and (orientation:landscape){.ov:not(.rd){padding-right:112px;padding-bottom:0}}

/* iPad ngang: thanh bên nhỏ gọn, chỉ có biểu tượng */
@media (min-width:768px) and (orientation:landscape){
  .nav{top:calc(50vh - 131px);top:calc(50svh - 131px);width:60px;padding:8px;gap:6px;border-radius:30px;box-shadow:0 6px 24px rgba(0,0,0,.28)}
  .nav button{width:44px;height:44px;padding:0;border-radius:50%;justify-content:center;margin:0 auto}
  .nav button span{display:none}
  .nav svg{width:24px;height:24px}
  .nav button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
  main{width:calc(100% - 92px)}
  .ov:not(.rd){padding-right:92px}
}

/* iPad dọc: thanh dưới nhỏ gọn, chỉ có biểu tượng */
@media (min-width:768px) and (orientation:portrait){
  .nav{width:auto;grid-template-columns:repeat(5,44px);gap:6px;padding:8px;border-radius:30px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 24px rgba(0,0,0,.28)}
  .nav button{width:44px;height:44px;padding:0;border-radius:50%;justify-content:center}
  .nav button span{display:none}
  .nav svg{width:24px;height:24px}
  .nav button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
  main{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
}

/* dịch truyện bằng AI */

<body>
<div class="top">
  <div class="brand g">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#ff5a1f"/><circle cx="20" cy="22.5" r="10" fill="#fff"/><path d="M20 12c0-4 3-6 7-6 0 4-3 6-7 6z" fill="#ffd9c7"/><path d="M16 22.5c1.5 2.2 6.5 2.2 8 0" stroke="#ff5a1f" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
    <b>Quýt<i>Truyện</i></b>
    <label for="lang" style="margin-left:auto"><select class="lang" id="lang" aria-label="Ngôn ngữ truyện">
      <option value="vi">Tiếng Việt</option><option value="en">English</option><option value="ja">日本語</option><option value="fr">Français</option><option value="es">Español</option><option value="pt-br">Português</option><option value="id">Indonesia</option><option value="th">ไทย</option>
    </select></label>
  </div>
</div>
<main id="view" class="g"></main>
<nav class="nav" id="nav" aria-label="Điều hướng chính"></nav>
<div id="overlay"></div>

<script src="config.js"></script>
<script>
(function(){
  var $=function(s,r){return (r||document).querySelector(s)};
  var view=$('#view'),navEl=$('#nav'),ovEl=$('#overlay'),langSel=$('#lang');
  var CFG={covers:'https://uploads.mangadex.org'};
  var BASE=(window.QT_API_BASE||'https://quyt-proxy.manhdungn111.workers.dev').replace(/\/$/,'');
  var VIA=/^https?:\/\//.test(BASE);
  var UUID=/^[0-9a-f-]{36}$/,FILE=/^[\w.\-]{1,150}$/;
  var RATING=['safe','suggestive'];
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
  function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function drop(k){try{localStorage.removeItem(k)}catch(e){}}

  var lang=load('qt-lang','vi'),saver=load('qt-saver',false),progress=load('qt-prog',{});
  var rdHide=true,spread=load('qt-spread',null),rtl=load('qt-rtl',false);
  function spreadOn(){return spread===null?innerWidth>=900:!!spread}
  langSel.value=lang;

  /* ---------- dữ liệu người dùng: yêu thích, lịch sử, tài khoản ---------- */
  function ci(x){
    if(!x||typeof x!=='object'||!UUID.test(x.id||''))return null;
    return {id:x.id,t:String(x.t||'').slice(0,200),c:FILE.test(x.c||'')?x.c:'',au:String(x.au||'').slice(0,100),
      ch:UUID.test(x.ch||'')?x.ch:'',l:String(x.l||'').slice(0,60),ts:+x.ts||0,d:!!x.d};
  }
  function cl(a){return (Array.isArray(a)?a:[]).map(ci).filter(Boolean)}
  var FAV=cl(load('qt-fav',[])),HIST=cl(load('qt-hist',[])),AUTH=load('qt-auth',null),lastSync=load('qt-last',0),syncMsg='',syncErr=false,syncTimer=null,syncing=false;
  if(!AUTH||!/^[a-z0-9_]{3,20}$/.test(AUTH.user||'')||!/^[0-9a-f]{64}$/.test(AUTH.token||''))AUTH=null;
  function alive(l){return l.filter(function(x){return !x.d}).sort(function(a,b){return b.ts-a.ts})}
  function persist(){save('qt-fav',FAV);save('qt-hist',HIST)}
  function changed(){persist();schedSync()}
  function find(l,id){for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null}
  function isFav(id){var f=find(FAV,id);return !!(f&&!f.d)}
  function authorsText(m){return m.authors.join(', ').slice(0,100)}
  function toggleFav(m){
    var f=find(FAV,m.id),now=Date.now();
    if(f){f.d=!f.d;f.ts=now;if(!f.d){f.t=m.title.slice(0,200);f.c=FILE.test(m.cover)?m.cover:'';f.au=authorsText(m)}}
    else FAV.push({id:m.id,t:m.title.slice(0,200),c:FILE.test(m.cover)?m.cover:'',au:authorsText(m),ch:'',l:'',ts:now,d:false});
    changed();return isFav(m.id);
  }
  function addHist(m,chId,label){
    var h=find(HIST,m.id),now=Date.now();
    if(h){h.t=m.title.slice(0,200);h.c=FILE.test(m.cover)?m.cover:'';h.au=authorsText(m);h.ch=chId;h.l=label.slice(0,60);h.ts=now;h.d=false}
    else HIST.push({id:m.id,t:m.title.slice(0,200),c:FILE.test(m.cover)?m.cover:'',au:authorsText(m),ch:chId,l:label.slice(0,60),ts:now,d:false});
    if(HIST.length>400){HIST.sort(function(a,b){return b.ts-a.ts});HIST=HIST.slice(0,400)}
    changed();
  }
  function merge(a,b){
    var m={};
    a.concat(b).forEach(function(x){var o=m[x.id];if(!o||x.ts>o.ts)m[x.id]=x});
    return Object.keys(m).map(function(k){return m[k]});
  }
  function when(ts){try{return new Date(ts).toLocaleString('vi-VN')}catch(e){return ''}}
  function syncText(){return syncMsg||(lastSync?'Đồng bộ lần cuối '+when(lastSync):'Chưa đồng bộ')}
  function setSync(t,err){syncMsg=t;syncErr=!!err;var el=$('#syncst');if(el){el.textContent=syncText();el.className='by'+(err?' ':'')+(err?'':'');el.style.color=err?'var(--err)':''}}
  function schedSync(){if(!AUTH||!VIA)return;clearTimeout(syncTimer);syncTimer=setTimeout(function(){syncNow()},4000)}

  var ERRS={bad_user:'Tên đăng nhập gồm 3 đến 20 ký tự: chữ thường, số hoặc dấu gạch dưới.',bad_key:'Mật khẩu không hợp lệ.',taken:'Tên này đã có người dùng.',bad_login:'Sai tên đăng nhập hoặc mật khẩu.',locked:'Nhập sai quá nhiều lần. Thử lại sau 15 phút.',no_kv:'Máy chủ chưa bật kho lưu trữ (KV). Xem hướng dẫn cài Worker.',unauthorized:'Phiên đăng nhập đã hết hạn. Đăng nhập lại.',too_big:'Dữ liệu quá lớn.',bad_request:'Yêu cầu không hợp lệ.',not_found:'Không tìm thấy.'};
  async function acct(path,opt){
    opt=opt||{};
    opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});
    if(AUTH)opt.headers.Authorization='Bearer '+AUTH.token;
    var r;
    try{r=await fetch(BASE+path,opt)}catch(e){throw new Error('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.')}
    var j=null;try{j=await r.json()}catch(e){}
    if(r.status===401&&AUTH&&j&&j.error==='unauthorized'){AUTH=null;drop('qt-auth');if(view.dataset.v==='me')draw(true)}
    if(!r.ok)throw new Error((j&&ERRS[j.error])||'Lỗi '+r.status+'.');
    return j;
  }
  async function syncNow(){
    if(!AUTH||!VIA||syncing)return;
    syncing=true;setSync('Đang đồng bộ...');
    try{
      var s=await acct('/sync');
      FAV=merge(FAV,cl(s.fav));HIST=merge(HIST,cl(s.hist));
      HIST.sort(function(a,b){return b.ts-a.ts});if(HIST.length>400)HIST=HIST.slice(0,400);
      persist();
      await acct('/sync',{method:'PUT',body:JSON.stringify({fav:FAV,hist:HIST})});
      lastSync=Date.now();save('qt-last',lastSync);
      setSync('');
      var v=view.dataset.v;if((v==='library'||v==='home')&&!ovEl.innerHTML)draw(true);
    }catch(e){setSync(e.message,true)}
    syncing=false;
  }
  async function derive(user,pw){
    var enc=new TextEncoder();
    var key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
    var bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode('quyt-truyen:'+user),iterations:150000},key,256);
    return Array.prototype.map.call(new Uint8Array(bits),function(b){return ('0'+b.toString(16)).slice(-2)}).join('');
  }
  var authMode='login';
  async function submitAuth(){
    var err=$('#auerr'),pr=$('#aupr'),btn=$('#aubtn');
    err.textContent='';
    var u=$('#au_u').value.trim().toLowerCase(),p=$('#au_p').value;
    if(!/^[a-z0-9_]{3,20}$/.test(u)){err.textContent=ERRS.bad_user;return}
    if(p.length<8){err.textContent='Mật khẩu cần ít nhất 8 ký tự.';return}
    if(authMode==='reg'&&p!==$('#au_p2').value){err.textContent='Hai mật khẩu chưa giống nhau.';return}
    if(!(window.crypto&&crypto.subtle)){err.textContent='Trình duyệt không hỗ trợ mã hóa. Dùng Safari hoặc Chrome bản mới.';return}
    btn.disabled=true;pr.textContent='Đang xử lý...';
    try{
      var k=await derive(u,p);
      var j=await acct('/auth/'+(authMode==='reg'?'register':'login'),{method:'POST',body:JSON.stringify({u:u,k:k})});
      AUTH={user:j.user,token:j.token};save('qt-auth',AUTH);
      pr.textContent='Đang đồng bộ...';
      await syncNow();
      draw(true);
    }catch(e){err.textContent=e.message;pr.textContent='';btn.disabled=false}
  }
  async function logout(){
    try{await acct('/auth/logout',{method:'POST',body:'{}'})}catch(e){}
    AUTH=null;drop('qt-auth');syncMsg='';draw(true);
  }

  /* ---------- giao diện chung ---------- */
  function ic(n){
    var p={search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',home:'<path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/>',back:'<path d="m15 5-7 7 7 7"/>',close:'<path d="M6 6l12 12M18 6 6 18"/>',saver:'<path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/>',
      grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
      heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>'}[n];
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
  }

  /* ---------- API MangaDex ---------- */
  function qs(o){
    var u=new URLSearchParams();
    Object.keys(o).forEach(function(k){
      var v=o[k];
      if(Array.isArray(v))v.forEach(function(x){u.append(k+'[]',x)});else if(v!=null&&v!=='')u.append(k,v);
    });
    return u.toString();
  }
  async function api(path,params){
    var r;
    try{r=await fetch(BASE+path+(params?'?'+qs(params):''))}catch(e){throw new Error('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.')}
    if(r.status===429)throw new Error('MangaDex đang giới hạn tốc độ. Đợi vài giây rồi thử lại.');
    var j=null;try{j=await r.json()}catch(e){}
    if(!r.ok&&!j&&r.status===404)throw new Error('Chưa có proxy MangaDex. Mở file config.js và điền địa chỉ Cloudflare Worker của bạn (xem hướng dẫn).');
    if(!r.ok)throw new Error((j&&j.errors&&j.errors[0]&&j.errors[0].detail)||(j&&j.error)||'MangaDex trả về lỗi '+r.status+'.');
    return j;
  }
  function listParams(extra){
    var p={limit:24,'includes':['cover_art','author'],contentRating:RATING,hasAvailableChapters:'true',availableTranslatedLanguage:[lang]};
    Object.keys(extra).forEach(function(k){p[k]=extra[k]});return p;
  }
  function pickTitle(a){
    var t=a.title||{};
    if(t[lang])return t[lang];
    var alt=(a.altTitles||[]).filter(function(x){return x[lang]})[0];
    if(alt)return alt[lang];
    return t.en||Object.keys(t).map(function(k){return t[k]})[0]||'Không có tên';
  }
  function norm(m){
    var a=m.attributes||{},rel=m.relationships||[],cover='',authors=[];
    rel.forEach(function(r){
      if(r.type==='cover_art'&&r.attributes&&r.attributes.fileName)cover=r.attributes.fileName;
      if(r.type==='author'&&r.attributes&&r.attributes.name)authors.push(r.attributes.name);
    });
    var d=a.description||{};
    return {id:m.id,title:pickTitle(a),authors:authors,cover:cover,desc:d[lang]||d.en||Object.keys(d).map(function(k){return d[k]})[0]||'',
      status:a.status,year:a.year,tags:(a.tags||[]).map(function(t){var n=t.attributes&&t.attributes.name;return n&&(n[lang]||n.en)}).filter(Boolean).slice(0,8)};
  }
  function directCover(m,size){return CFG.covers+'/covers/'+m.id+'/'+m.cover+'.'+(size||256)+'.jpg'}
  function coverUrl(m,size){if(!m.cover)return '';return VIA?BASE+'/covers/'+m.id+'/'+m.cover+'.'+(size||256)+'.jpg':directCover(m,size)}
  function wsrv(u,w){return 'https://wsrv.nl/?url='+encodeURIComponent(u)+(w?'&w='+w:'')}
  function coverAlt(m,size){if(!m.cover)return '';var d=directCover(m,size);return (VIA?[d,wsrv(d,size)]:[wsrv(d,size)]).map(encodeURI).join(' ')}
  function pageAlts(d){return (VIA?[d,wsrv(d)]:[wsrv(d)]).map(encodeURI).join(' ')}
  function pageUrl(d){return VIA?BASE+'/proxy?u='+encodeURIComponent(d):d}
  function showBanner(){var b=$('#rbanner');if(b)b.hidden=false}
  document.addEventListener('load',function(e){var t=e.target;if(!t||t.tagName!=='IMG'||!t.classList.contains('rimg'))return;var r=t.naturalHeight/t.naturalWidth;t.classList.toggle('long',r>2.2);t.classList.toggle('span',r<0.9)},true);
  document.addEventListener('click',function(e){var t=e.target;if(t&&t.classList&&t.classList.contains('rimg')){var r=$('#rd');if(r){r.classList.toggle('noui');rdHide=r.classList.contains('noui')}}});
  document.addEventListener('error',function(e){
    var t=e.target;if(!t||t.tagName!=='IMG')return;
    var list=(t.dataset.alt||'').split(' ').filter(Boolean);
    if(list.length){t.src=decodeURI(list.shift());t.dataset.alt=list.join(' ')}
    else if(t.classList.contains('rimg'))showBanner();
  },true);
  var STATUS={ongoing:'Đang ra',completed:'Hoàn thành',hiatus:'Tạm ngưng',cancelled:'Đã hủy'};

  /* ---------- thẻ truyện ---------- */
  function imgTag(m,size,lazy){
    var u=coverUrl(m,size);
    return u?'<img src="'+esc(u)+'" data-alt="'+esc(coverAlt(m,size))+'" alt="'+esc(m.title)+'"'+(lazy?' loading="lazy"':'')+' referrerpolicy="no-referrer">':'';
  }
  function card(m){
    return '<button class="card" data-open="'+esc(m.id)+'"><div class="thumb">'+imgTag(m,256,true)+'</div><div class="t">'+esc(m.title)+'</div><div class="s">'+esc(m.authors.join(', '))+'</div></button>';
  }
  function fromItem(x){return {id:x.id,title:x.t||'Không có tên',cover:x.c,authors:x.au?[x.au]:[]}}
  function skeleton(n){var o='';for(var i=0;i<n;i++)o+='<div class="sk"></div>';return '<div class="grid">'+o+'</div>'}
  function credit(){return '<p class="credit">Dữ liệu và ảnh từ <a href="https://mangadex.org" target="_blank" rel="noopener">MangaDex</a>. Quyền thuộc tác giả và nhóm dịch.</p>'}

  /* ---------- danh sách có phân trang ---------- */
  var pagers={};
  function makePager(boxId,getExtra){
    var st={off:0,list:[],my:0};
    async function run(reset){
      var box=$('#'+boxId);if(!box)return;
      var my=++st.my;
      if(reset){st.off=0;st.list=[];box.innerHTML=skeleton(6)}
      try{
        var ex=getExtra();ex.limit=20;ex.offset=st.off;
        var j=await api('/manga',listParams(ex));
        box=$('#'+boxId);if(my!==st.my||!box)return;
        var l=(j.data||[]).map(norm);
        if(!l.length&&reset){box.innerHTML='<div class="msg">Không tìm thấy truyện nào. Thử bộ lọc khác hoặc đổi ngôn ngữ ở góc trên.</div>';return}
        st.list=st.list.concat(l);st.off+=l.length;
        box.innerHTML='<div class="grid">'+st.list.map(card).join('')+'</div>'+(st.off<(j.total||0)?'<div class="btns"><button class="btn" data-pmore="'+boxId+'">Xem thêm</button></div>':'');
      }catch(e){box=$('#'+boxId);if(my===st.my&&box)box.innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}
    }
    pagers[boxId]={run:run};
    return pagers[boxId];
  }

  /* ---------- tag / thể loại ---------- */
  var TAGS=null;
  async function loadTags(){
    if(TAGS)return TAGS;
    var j=await api('/manga/tag');
    TAGS=(j.data||[]).map(function(t){var n=t.attributes.name||{};return {id:t.id,name:n[lang]||n.en||Object.keys(n).map(function(k){return n[k]})[0]||'',group:t.attributes.group}}).sort(function(a,b){return a.name.localeCompare(b.name)});
    return TAGS;
  }
  function hue(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))%360;return h}

  /* ---------- các màn hình ---------- */
  var tab='home',token=0,libTab='fav',authView=0;
  var TABS=[['home','Trang chủ','home'],['genres','Thể loại','grid'],['search','Tìm kiếm','search'],['library','Thư viện','heart'],['me','Tôi','user']];
  function setNav(){
    navEl.innerHTML=TABS.map(function(n){return '<button data-go="'+n[0]+'"'+(n[0]===tab?' aria-current="page"':'')+' aria-label="'+n[1]+'" title="'+n[1]+'">'+ic(n[2])+'<span>'+n[1]+'</span></button>'}).join('');
  }
  var SECTIONS=[['Theo dõi nhiều nhất',{'order[followedCount]':'desc'}],['Mới cập nhật',{'order[latestUploadedChapter]':'desc'}],['Mới thêm',{'order[createdAt]':'desc'}]];
  function vHome(){
    var my=++token,rec=alive(HIST).slice(0,6),o='';
    if(rec.length)o+='<section class="sec"><h3>Đang đọc dở</h3><div class="grid">'+rec.map(function(x){return card(fromItem(x))}).join('')+'</div></section>';
    o+=SECTIONS.map(function(s,i){return '<section class="sec"><h3>'+s[0]+'</h3><div id="sec'+i+'">'+skeleton(6)+'</div></section>'}).join('')+credit();
    view.innerHTML=o;
    SECTIONS.forEach(function(s,i){
      api('/manga',listParams(Object.assign({limit:12},s[1]))).then(function(j){
        if(my!==token)return;
        var el=$('#sec'+i);if(!el)return;
        var l=(j.data||[]).map(norm);
        el.innerHTML=l.length?'<div class="grid">'+l.map(card).join('')+'</div>':'<div class="msg">Chưa có truyện cho ngôn ngữ này.</div>';
      }).catch(function(e){
        if(my!==token)return;var el=$('#sec'+i);if(el)el.innerHTML='<div class="msg err">'+esc(e.message)+' <button class="more" data-retry>Thử lại</button></div>';
      });
    });
  }

  function vGenres(){
    var my=++token;
    view.innerHTML='<section class="sec"><h3>Thể loại</h3><div id="gbox">'+skeleton(4)+'</div></section>'+credit();
    loadTags().then(function(tags){

      return new Promise(function(res,rej){var u=URL.createObjectURL(b),im=new Image();im.onload=function(){URL.revokeObjectURL(u);res(im)};im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('Không đọc được ảnh trang'))};im.src=u})
    }).then(function(im){
      var w=im.naturalWidth||400,h=im.naturalHeight||560,s=Math.min(1,1400/Math.max(w,h)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      return c.toDataURL('image/jpeg',0.72);
    });
  }
  function aiCall(img){
    return aiShot(img).then(function(d){return fetch(BASE+'/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({img:d})})}).then(function(r){
      return r.json().catch(function(){return {}}).then(function(j){
        if(!r.ok){var e=new Error(aiErr(j.error,r.status));e.fatal=(j.error==='no_ai'||j.error==='quota'||j.error==='forbidden');throw e}
        return j.items||[];
      });
    });
  }
  function aiStart(cid){
    if(aiSt&&aiSt.io)aiSt.io.disconnect();
    var imgs=[].slice.call(document.querySelectorAll('#rd .rimg'));
    aiSt={cid:cid,imgs:imgs,vis:{},busy:0,pending:{},fail:{},err:VIA?'':'Cần dùng Cloudflare Worker để dịch AI.',io:null};
    if('IntersectionObserver' in window){
      var st=aiSt;
      st.io=new IntersectionObserver(function(es){es.forEach(function(e){var i=imgs.indexOf(e.target);if(e.isIntersecting)st.vis[i]=1;else delete st.vis[i]});aiRender();aiPump()},{root:$('#rd'),threshold:0.5});
      imgs.forEach(function(im){st.io.observe(im)});
    }
    aiRender();aiPump();
  }
  function aiDone(st){var n=0;st.imgs.forEach(function(x,i){if(aiCache[st.cid+':'+i])n++});return n}
  function aiRender(){
    var el=$('#aisheet');if(!el)return;
    if(!aiOn||!aiSt){el.hidden=true;return}
    var st=aiSt,N=st.imgs.length,done=aiDone(st),idx=Object.keys(st.vis).map(Number).sort(function(a,b){return a-b});
    if(aiFull){idx=[];for(var q=0;q<N;q++)idx.push(q)}else if(!idx.length)idx=[0];
    var o='<button class="aihd" data-aimin><span>Bản dịch AI · '+(aiFull?'Cả chương':'Trang '+idx.map(function(i){return i+1}).join(', '))+'</span><span>Đã dịch '+done+'/'+N+' · '+(aiMin?'Mở ▴':'Thu ▾')+'</span></button><div class="abody">';
    o+='<div class="aibar"><div class="aipg"><i style="width:'+(N?Math.round(done*100/N):0)+'%"></i></div><button class="aitg" data-aifull>'+(aiFull?'Chỉ trang đang xem':'Xem cả chương')+'</button></div>';
    if(st.err)o+='<p class="er">'+esc(st.err)+'</p>';
    else idx.forEach(function(i){
      var k=st.cid+':'+i,it=aiCache[k];
      if(idx.length>1)o+='<div class="pn">Trang '+(i+1)+'</div>';
      if(it){o+=it.length?it.map(function(x){return '<p>'+esc(x.v)+(x.s?'<span class="s">'+esc(x.s)+'</span>':'')+'</p>'}).join(''):'<p><span class="s">Trang này không có chữ.</span></p>'}
      else if(st.fail[i])o+='<p class="er">'+esc(st.fail[i])+'</p>';
      else o+='<p><span class="s">'+(st.pending[i]?'Đang dịch...':'Đang chờ đến lượt...')+'</span></p>';
    });
    el.innerHTML=o+'</div>';el.classList.toggle('min',aiMin);el.classList.toggle('full',aiFull);el.hidden=false;
  }
  function aiPump(){
    var st=aiSt;if(!aiOn||!st||st.err)return;
    var N=st.imgs.length;if(!N||!document.body.contains(st.imgs[0]))return;
    var ks=Object.keys(st.vis).map(Number),start=ks.length?Math.min.apply(null,ks):0;
    while(st.busy<2){
      var pick=-1;
      for(var k=0;k<N;k++){var i=(start+k)%N,key=st.cid+':'+i;if(!aiCache[key]&&!st.fail[i]&&!st.pending[i]){pick=i;break}}
      if(pick<0)break;
      st.busy++;st.pending[pick]=1;
      (function(i,key){
        aiLoaded(st.imgs[i]).then(function(){return aiCall(st.imgs[i])}).then(function(items){aiCache[key]=items.slice(0,40);aiSaveCache()}).catch(function(e){if(e.fatal)st.err=e.message;else st.fail[i]=e.message||'Dịch AI lỗi'}).then(function(){delete st.pending[i];st.busy--;if(aiSt!==st)return;aiRender();aiPump()});
      })(pick,st.cid+':'+pick);
    }
    aiRender();
  }

  /* ---------- điều hướng ---------- */
  var curHash='',stack=[],going=false,lastKey=null;
  function track(h){
    if(!going&&curHash&&!/^r-/.test(curHash)&&curHash!==h)stack.push(curHash);
    going=false;
  }
  function draw(keep){
    var y=window.scrollY,key=lastKey&&ROUTES[lastKey]?lastKey:'home';
    var h=location.hash.replace('#','');
    if(ROUTES[h])key=h;else if(h===''||h==='home')key='home';
    lastKey=key;tab=key;view.dataset.v=key;view.dataset.drawn='1';
    setNav();ROUTES[key]();
    window.scrollTo(0,keep?y:0);
  }
  function render(){
    var h=location.hash.replace('#',''),m;
    function ensure(){if(!view.dataset.drawn)draw()}
    if((m=h.match(/^m-([0-9a-f-]{36})$/))){track(h);ensure();openDetail(m[1]);curHash=h;return}
    if((m=h.match(/^g-([0-9a-f-]{36})$/))){track(h);ensure();openGenre(m[1]);curHash=h;return}
    if((m=h.match(/^r-([0-9a-f-]{36})-([0-9a-f-]{36})$/))){ensure();openReader(m[1],m[2]);curHash=h;return}
    var had=ovEl.innerHTML!=='';
    ovEl.innerHTML='';document.body.style.overflow='';
    stack=[];going=false;curHash=h;
    var want=ROUTES[h]?h:(h===''||h==='home'?'home':lastKey||'home');
    draw(had&&want===lastKey);
  }
  function goBack(){
    var h=location.hash.replace('#',''),m=h.match(/^r-([0-9a-f-]{36})-/);
    if(m){location.hash='m-'+m[1];return}
    going=true;var p=stack.pop();
    var dest=p!=null?p:(lastKey&&lastKey!=='home'?lastKey:'');
    if(('#'+dest)===location.hash||(dest===''&&!location.hash)){going=false;render();return}
    location.hash=dest;
    setTimeout(function(){going=false},0);
  }

  /* ---------- sự kiện ---------- */
  var SEL='[data-go],[data-open],[data-read],[data-back],[data-pmore],[data-retry],[data-desc],[data-saver],[data-ai],[data-aimin],[data-aifull],[data-spread],[data-rtl],[data-tag],[data-tagmore],[data-tagclear],[data-genre],[data-fav],[data-lib],[data-hdel],[data-hclear],[data-authmode],[data-logout],[data-sync],[data-diag],[data-theme]';
  document.addEventListener('click',function(e){
    var t=e.target.closest(SEL);
    if(!t||t.disabled)return;
    var D=t.dataset;
    if('go' in D){var d=D.go==='home'?'':D.go;if(location.hash.replace('#','')===d&&!ovEl.innerHTML){render()}else{location.hash=d;if(!location.hash)render()}return}
    if('open' in D){location.hash='m-'+D.open;return}
    if('read' in D){var p=D.read.split('|');location.hash='r-'+p[0]+'-'+p[1];return}
    if('back' in D){goBack();return}
    if('pmore' in D){pagers[D.pmore]&&pagers[D.pmore].run(false);return}
    if('retry' in D){draw(true);return}
    if('desc' in D){var ds=$('#desc');ds.classList.toggle('open');t.textContent=ds.classList.contains('open')?'Thu gọn':'Xem thêm';return}
    if('ai' in D){aiOn=!aiOn;save('qt-ai',aiOn);if(aiSt){aiSt.err=VIA?'':aiSt.err;aiSt.fail={};if(aiSt.err&&VIA)aiSt.err=''}document.querySelectorAll('[data-ai]').forEach(function(b){b.setAttribute('aria-pressed',aiOn)});aiRender();aiPump();return}
    if('aifull' in D){aiFull=!aiFull;aiMin=false;aiRender();return}
    if('aimin' in D){aiMin=!aiMin;aiRender();return}
    if('spread' in D){spread=!spreadOn();save('qt-spread',spread);t.setAttribute('aria-pressed',spread);var pg=$('#pages');if(pg)pg.classList.toggle('two',spread);return}
    if('rtl' in D){rtl=!rtl;save('qt-rtl',rtl);t.setAttribute('aria-pressed',rtl);var rdx=$('#rd');if(rdx)rdx.classList.toggle('rtl',rtl);var pg2=$('#pages');if(pg2)pg2.classList.toggle('rtl',rtl);return}
    if('saver' in D){saver=!saver;save('qt-saver',saver);var m2=location.hash.match(/^#r-([0-9a-f-]{36})-([0-9a-f-]{36})$/);if(m2)openReader(m2[1],m2[2]);return}
    if('tag' in D){var i=F.tags.indexOf(D.tag);if(i>-1)F.tags.splice(i,1);else F.tags.push(D.tag);drawTags();pagers.sres&&pagers.sres.run(true);return}
    if('tagmore' in D){tagsAll=!tagsAll;drawTags();return}
    if('tagclear' in D){F.tags=[];drawTags();pagers.sres&&pagers.sres.run(true);return}
    if('genre' in D){location.hash='g-'+D.genre;return}
    if('fav' in D){var mm=cur&&cur.m.id===D.fav?cur.m:null;if(!mm)return;var on=toggleFav(mm);t.textContent=favLabel(on);t.classList.toggle('on',on);return}
    if('lib' in D){libTab=D.lib;draw(true);return}
    if('hdel' in D){var h2=find(HIST,D.hdel);if(h2){h2.d=true;h2.ts=Date.now();changed();draw(true)}return}
    if('hclear' in D){var now=Date.now();HIST.forEach(function(x){if(!x.d){x.d=true;x.ts=now}});changed();draw(true);return}
    if('authmode' in D){authMode=D.authmode;draw(true);return}
    if('logout' in D){logout();return}
    if('sync' in D){syncNow();return}
    if('diag' in D){var dv=$('#diag');dv.hidden=false;runDiag();return}
    if('theme' in D){var r=document.documentElement,dark=getComputedStyle(r).colorScheme.indexOf('dark')>-1;r.setAttribute('data-theme',dark?'light':'dark')}
  });
  document.addEventListener('input',function(e){
    if(e.target.id==='q'){sq=e.target.value;clearTimeout(stimer);stimer=setTimeout(function(){pagers.sres&&pagers.sres.run(true)},350)}
  });
  document.addEventListener('change',function(e){
    var id=e.target.id,m={fsort:'sort',fstatus:'status',fdemo:'demo'}[id];
    if(m){F[m]=e.target.value;pagers.sres&&pagers.sres.run(true)}
    if(id==='gsort'){GS=e.target.value;pagers.gres&&pagers.gres.run(true)}
  });
  document.addEventListener('submit',function(e){if(e.target.id==='authform'){e.preventDefault();submitAuth()}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ovEl.innerHTML){goBack()}});
  langSel.addEventListener('change',function(){
    lang=langSel.value;save('qt-lang',lang);cur=null;TAGS=null;
    if(/^#(m|r|g)-/.test(location.hash)){location.hash=''}
    else render();
  });
  window.addEventListener('hashchange',render);
  window.addEventListener('online',function(){schedSync()});

  fetch('/config').then(function(r){return r.json()}).then(function(c){if(c&&c.covers)CFG.covers=c.covers}).catch(function(){}).then(function(){render();if(AUTH&&VIA)syncNow()});
})();
</script>
