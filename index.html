<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MangoTruyện</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--tx:#fff;--mu:#8e8e93;--ac:#ff5a1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#fff;--card:#f2f2f4;--tx:#111;--mu:#6b6b70}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
body{max-width:640px;margin:0 auto;padding-bottom:84px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.logo{font-size:24px;font-weight:800;letter-spacing:-.5px}.logo b{color:var(--ac)}
.av{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;border:0;color:var(--tx);overflow:hidden;font-size:15px}
.av img{width:100%;height:100%;object-fit:cover}
.chips{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}.chips button{border:0;background:none;color:var(--mu);font-size:17px;padding:8px 14px;border-radius:20px;white-space:nowrap}
.chips button.on{background:var(--card);color:var(--tx);font-weight:600}
.banner{margin:6px 0 0;height:230px;position:relative;background:var(--card) center/cover;display:flex;align-items:flex-end;cursor:pointer}
.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.85))}
.banner div{position:relative;z-index:1;padding:16px;font-size:26px;font-weight:700;color:#fff}.banner small{display:block;font-size:14px;color:#ddd;font-weight:500}
h2{font-size:19px;margin:20px 16px 10px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:0 16px}
.c{cursor:pointer;position:relative}.c .im{aspect-ratio:3/4;border-radius:10px;background:var(--card) center/cover;position:relative;overflow:hidden}
.c .t{margin-top:6px;font-size:15px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{position:absolute;right:0;top:0;background:var(--ac);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-bottom-left-radius:10px}
.heart{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.5);border:0;color:#fff;border-radius:50%;width:30px;height:30px;font-size:15px}
.heart.on{color:#ff3b5c}
.bar{height:3px;background:rgba(255,255,255,.25);position:absolute;left:0;right:0;bottom:0}.bar i{display:block;height:100%;background:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:50px 24px;line-height:1.6}
.btn{background:var(--ac);color:#fff;border:0;border-radius:24px;padding:12px 22px;font-size:16px;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;background:#1c1c1e;display:flex;max-width:640px;margin:0 auto;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:#8e8e93;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}nav button span{font-size:22px}nav button.on{color:#fff;font-weight:600}nav button.on span{color:var(--ac)}
.sr{padding:12px 16px}.sr input{width:100%;padding:13px 16px;border-radius:24px;border:0;background:var(--card);color:var(--tx);font-size:16px;outline:0}
#rd{position:fixed;inset:0;background:#000;z-index:20;overflow-y:auto;display:none}
#rd img{display:block;width:100%;max-width:800px;margin:0 auto;min-height:200px}
.rb{position:fixed;left:0;right:0;z-index:21;background:rgba(20,20,22,.92);color:#fff;display:none;align-items:center;gap:10px;padding:10px 14px}
#rt{top:0;padding-top:calc(10px + env(safe-area-inset-top,0px))}#rbm{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));justify-content:space-between}
.rb button{background:#333;color:#fff;border:0;border-radius:18px;padding:9px 14px;font-size:15px}.rb .tt{flex:1;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;z-index:30;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto;display:none}
.sheet h3{margin:0 0 12px}.sheet p{line-height:1.55;margin:8px 0;white-space:pre-wrap}.sheet input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--mu);background:var(--bg);color:var(--tx);margin:6px 0;font-size:16px}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.row .btn.s{background:#333}
#tst{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;z-index:40;display:none;font-size:14px}
.chg{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chg button{background:#333;color:#fff;border:0;border-radius:16px;padding:7px 13px;font-size:14px}.chg button.on{background:var(--ac)}
.g{font-size:12px;color:var(--mu);margin-top:2px}.ph{display:grid;place-items:center;font-size:42px;font-weight:800;color:#fff;background:linear-gradient(135deg,#ff5a1f,#7b2ff7)}
.dt{display:flex;gap:14px}.dt .im{width:110px;flex:none;aspect-ratio:3/4;border-radius:10px;background:var(--card) center/cover}
.ch{display:flex;justify-content:space-between;padding:13px 4px;border-bottom:1px solid #333;cursor:pointer}.ch small{color:var(--mu)}.ch.cu{color:var(--ac);font-weight:700}
.sheet label{font-size:13px;color:var(--mu)}
</style></head><body>
<header><div class="logo"><b>Mango</b>Truyện</div><button class="av" id="av"></button></header>
<div class="chips" id="chips"></div>
<main id="main"></main>
<nav id="nav"></nav>
<div id="rd"></div>
<div class="rb" id="rt"><button id="rx">‹</button><span class="tt" id="rtt"></span><button id="rtr">🌐 Dịch</button></div>
<div class="rb" id="rbm"><button id="rp">‹ Trước</button><span id="rpg"></span><button id="rn">Sau ›</button></div>
<div class="sheet" id="sh"></div><div id="tst"></div>
<input type="file" id="fp" multiple accept="image/*" hidden><input type="file" id="fz" multiple accept=".zip,.cbz,application/zip,image/*" hidden><input type="file" id="fc" accept="image/*" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const GEN=['Hành động','Tình cảm','Hài hước','Phiêu lưu','Kinh dị','Học đường','Giả tưởng','Trinh thám','Đời thường','Võ thuật','Isekai'];
let meta={},PG={},tab='home',gf='',q='',cur=null,user=null,db=null,uid=null,F={};
try{meta=JSON.parse(localStorage.getItem('mt_meta')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('mt_meta',JSON.stringify(meta))}catch(e){toast('Bộ nhớ đầy, bìa có thể không lưu được')}};
const toast=m=>{const t=$('#tst');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const titles=()=>Object.keys(meta).filter(t=>meta[t].chs&&meta[t].chs.length);
const pages=(t,i)=>PG[t]&&PG[t][i];
// ---------- render
function card(t){const m=meta[t],p=m.ts?Math.round(100*(m.pg||0)/Math.max(1,(pages(t,m.ch||0)||[1,2]).length-1)):0;
const bg=m.poster?`style="background-image:url('${m.poster}')"`:'';
return `<div class="c" data-c="${esc(t)}"><div class="im ${m.poster?'':'ph'}" ${bg}>${m.poster?'':esc(t[0]||'?')}<span class="tag">${m.chs.length} chương</span><button class="heart ${m.fav?'on':''}" data-f="${esc(t)}">${m.fav?'♥':'♡'}</button>${m.ts?`<div class="bar"><i style="width:${p}%"></i></div>`:''}</div><div class="t">${esc(t)}</div><div class="g">${esc((m.genres||[]).slice(0,2).join(' · '))}</div></div>`}
const addBtn=`<div class="empty"><button class="btn" id="add">＋ Thêm truyện</button></div>`;
const empty=m=>`<div class="empty">${m}</div>`+addBtn;
function render(){
let T=titles(),gs=[...new Set(T.flatMap(t=>meta[t].genres||[]))];
$('#chips').style.display=tab==='home'?'flex':'none';
$('#chips').innerHTML=[['','Trang Chủ'],...gs.map(g=>[g,g])].map(([k,l])=>`<button class="${gf===k?'on':''}" data-g="${esc(k)}">${esc(l)}</button>`).join('');
$('#nav').innerHTML=[['home','⌂','Trang chủ'],['read','▶','Đang đọc'],['md','◎','MangaDex'],['search','⌕','Tìm kiếm'],['fav','♥','Yêu thích']].map(([k,i,l])=>`<button class="${tab===k?'on':''}" data-t="${k}"><span>${i}</span>${l}</button>`).join('');
let h='';
if(tab==='home'){let L=gf?T.filter(t=>(meta[t].genres||[]).includes(gf)):T;
 if(!T.length)h=empty('Chưa có truyện nào.<br>Thêm truyện kèm poster, thể loại và chương.');
 else{const b=[...T].sort((a,b)=>(meta[b].ts||meta[b].added||0)-(meta[a].ts||meta[a].added||0))[0],m=meta[b];
 h=`<div class="banner ${m.poster?'':'ph'}" data-c="${esc(b)}" style="${m.poster?`background-image:url('${m.poster}')`:''}"><div>${esc(b)}<small>${m.chs.length} chương · ${esc((m.genres||[]).join(', '))}</small></div></div><h2>${gf||'Tin hot hôm nay'}</h2><div class="grid">${L.map(card).join('')}</div>`+addBtn}
}else if(tab==='read'){const L=T.filter(t=>meta[t].ts).sort((a,b)=>meta[b].ts-meta[a].ts);h=`<h2>Đang đọc</h2>`+(L.length?`<div class="grid">${L.map(card).join('')}</div>`:empty('Bạn chưa đọc truyện nào.'))}
else if(tab==='md'){h=mdView()}
else if(tab==='fav'){const L=T.filter(t=>meta[t].fav);h=`<h2>Yêu thích</h2>`+(L.length?`<div class="grid">${L.map(card).join('')}</div>`:empty('Nhấn ♡ trên bìa truyện để lưu.'))}
else{const L=T.filter(t=>(t+' '+(meta[t].genres||[]).join(' ')).toLowerCase().includes(q.toLowerCase()));h=`<div class="sr"><input id="qi" placeholder="Tìm theo tên hoặc thể loại..." value="${esc(q)}"></div>`+(L.length?`<div class="grid">${L.map(card).join('')}</div>`:'<div class="empty">Không tìm thấy.</div>')}
$('#main').innerHTML=h;if(tab==='md')mdBind();const qi=$('#qi');if(qi)qi.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$('#qi');n.focus();n.setSelectionRange(p,p)};
renderAv()}
function renderAv(){const a=$('#av');a.innerHTML=user&&user.avatar?`<img src="${esc(user.avatar)}">`:(user&&user.name?esc(user.name[0].toUpperCase()):'👤')}
document.addEventListener('click',e=>{const t=e.target;
if(t.closest('#add'))return openAdd();
const f=t.closest('[data-f]');if(f){const m=meta[f.dataset.f];m.fav=m.fav?0:1;save();render();sync();return}
const g=t.closest('[data-g]');if(g){gf=g.dataset.g;render();return}
const n=t.closest('[data-t]');if(n){tab=n.dataset.t;render();return}
const mm=t.closest('[data-m]');if(mm)return mdOpen(+mm.dataset.m);const c=t.closest('[data-c]');if(c)openD(c.dataset.c)});
$('#av').onclick=sheetAcc;
// ---------- detail
function openD(t){const m=meta[t],sh=$('#sh');sh.style.display='block';
sh.innerHTML=`<div class="dt"><div class="im ${m.poster?'':'ph'}" style="${m.poster?`background-image:url('${m.poster}')`:''}">${m.poster?'':esc(t[0])}</div><div><h3 style="margin:0 0 6px">${esc(t)}</h3><div class="g">${esc((m.genres||[]).join(' · ')||'Chưa có thể loại')}</div><div class="g">${m.chs.length} chương</div><div class="row"><button class="btn" id="dr">▶ ${m.ts?'Đọc tiếp':'Đọc'}</button></div></div></div><div class="row"><button class="btn s" id="da">＋ Thêm chương</button><button class="btn s" id="dd">Xoá</button><button class="btn s" id="shx">Đóng</button></div><div style="margin-top:10px">${m.chs.map((c,i)=>`<div class="ch ${m.ts&&m.ch===i?'cu':''}" data-i="${i}"><span>${esc(c)}</span><small>${pages(t,i)?pages(t,i).length+' trang':(m.md?'MangaDex':'cần thêm lại tệp')}</small></div>`).join('')}</div>`;
$('#shx').onclick=()=>sh.style.display='none';
$('#dr').onclick=()=>{sh.style.display='none';openR(t,m.ts?m.ch||0:0,m.ts?m.pg||0:0)};
$('#da').onclick=()=>openAdd(t);
$('#dd').onclick=()=>{if(confirm('Xoá truyện này khỏi thư viện?')){delete meta[t];delete PG[t];save();sh.style.display='none';render();sync()}};
sh.querySelectorAll('.ch').forEach(r=>r.onclick=()=>{const i=+r.dataset.i;if(pages(t,i)||m.md){sh.style.display='none';openR(t,i,i===m.ch?m.pg||0:0)}else openAdd(t,m.chs[i])})}
// ---------- add
function thumb(url){return new Promise(r=>{const i=new Image();i.onload=()=>{const w=260,h=Math.round(i.height*w/i.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);r(c.toDataURL('image/jpeg',.6))};i.onerror=()=>r('');i.src=url})}
const nsort=(a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true});
function openAdd(t,chn){const sh=$('#sh');sh.style.display='block';F={pages:[],poster:null};
const m=t&&meta[t],gsel=new Set(m?m.genres||[]:[]);
sh.innerHTML=`<h3>Thêm truyện / chương</h3><label>Tên truyện</label><input id="at" list="al" value="${esc(t||'')}" placeholder="Tên truyện"><datalist id="al">${titles().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
<label>Tên / số chương</label><input id="ac" value="${esc(chn||'Chương '+(m?m.chs.length+1:1))}">
<label>Thể loại</label><div class="chg" id="ag">${GEN.map(g=>`<button data-gn="${g}" class="${gsel.has(g)?'on':''}">${g}</button>`).join('')}</div>
<label>Poster (bìa)</label><div class="row" style="margin-top:4px"><button class="btn s" id="apb">🖼 Chọn poster</button><span id="apn" class="g" style="align-self:center">Mặc định: trang đầu</span></div>
<label style="display:block;margin-top:12px">Trang truyện</label><div class="row" style="margin-top:4px"><button class="btn s" id="aph">📷 Ảnh trên điện thoại</button><button class="btn s" id="azf">📁 Tệp .zip/.cbz</button></div><div class="g" id="ainf">Chưa chọn trang nào</div>
<div class="row"><button class="btn" id="asv">Lưu</button><button class="btn s" id="shx">Huỷ</button></div>`;
$('#shx').onclick=()=>sh.style.display='none';
$('#ag').onclick=e=>{const b=e.target.closest('button');if(!b)return;b.classList.toggle('on')};
$('#at').oninput=e=>{const x=meta[e.target.value];if(x){$('#ac').value='Chương '+(x.chs.length+1);$('#ag').querySelectorAll('button').forEach(b=>b.classList.toggle('on',(x.genres||[]).includes(b.dataset.gn)))}};
$('#apb').onclick=()=>$('#fc').click();$('#aph').onclick=()=>$('#fp').click();$('#azf').onclick=()=>$('#fz').click();
$('#asv').onclick=async()=>{const title=$('#at').value.trim(),cn=$('#ac').value.trim()||'Chương 1';
if(!title)return toast('Nhập tên truyện');if(!F.pages.length)return toast('Chọn ảnh hoặc tệp trang truyện');
const g=[...$('#ag').querySelectorAll('.on')].map(b=>b.dataset.gn);
let x=meta[title];if(!x)x=meta[title]={fav:0,ts:0,ch:0,pg:0,genres:[],poster:'',chs:[],added:Date.now()};
if(g.length)x.genres=g;
if(F.poster)x.poster=await thumb(F.poster);else if(!x.poster)x.poster=await thumb(F.pages[0]);
(PG[title]=PG[title]||[]);let i=x.chs.indexOf(cn);if(i<0){x.chs.push(cn);i=x.chs.length-1}PG[title][i]=F.pages;
save();sh.style.display='none';render();sync();toast('Đã thêm '+cn)};}
const info=()=>{const n=$('#ainf');if(n)n.textContent=F.pages.length?F.pages.length+' trang đã chọn':'Chưa chọn trang nào'};
$('#fc').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f){F.poster=URL.createObjectURL(f);$('#apn').textContent='Đã chọn: '+f.name}};
$('#fp').onchange=e=>{const fs=[...e.target.files].sort(nsort);e.target.value='';F.pages.push(...fs.map(f=>URL.createObjectURL(f)));info()};
$('#fz').onchange=async e=>{const fs=[...e.target.files].sort(nsort);e.target.value='';toast('Đang nạp…');
try{for(const f of fs){if(/\.(zip|cbz)$/i.test(f.name)){const zz=await JSZip.loadAsync(f);const en=Object.values(zz.files).filter(x=>!x.dir&&/\.(jpe?g|png|webp|gif)$/i.test(x.name)).sort(nsort);
for(const x of en){const ext=x.name.split('.').pop().toLowerCase().replace('jpg','jpeg');F.pages.push(URL.createObjectURL(new Blob([await x.async('blob')],{type:'image/'+ext})))}}
else if(f.type.startsWith('image/'))F.pages.push(URL.createObjectURL(f))}}catch(err){toast('Lỗi đọc tệp')}info()};
// ---------- reader
let io=null,page=0;
async function openR(t,ci,pg){let P=pages(t,ci);const m0=meta[t];if(!P&&m0.md){toast('Đang tải trang…');try{P=await mdPages(m0.md.cids[ci])}catch(e){return toast('Không tải được chương (kiểm tra mạng)')}(PG[t]=PG[t]||[])[ci]=P}if(!P)return openAdd(t,meta[t].chs[ci]);cur={t,ci};const m=meta[t];m.ts=Date.now();m.ch=ci;m.pg=pg||0;save();
$('#rd').style.display='block';$('#rd').innerHTML=P.map((p,i)=>`<img data-i="${i}" src="${p}">`).join('');
$('#rtt').textContent=t+' · '+m.chs[ci];document.body.style.overflow='hidden';
setTimeout(()=>{const im=$('#rd').children[pg||0];if(im)im.scrollIntoView()},80);
io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){page=+x.target.dataset.i;m.pg=page;$('#rpg').textContent=(page+1)+' / '+P.length}}),{root:$('#rd'),threshold:.5});
[...$('#rd').children].forEach(i=>io.observe(i));$('#rd').scrollTop=pg?$('#rd').scrollTop:0;bars(1);setTimeout(()=>bars(0),2200)}
function bars(s){$('#rt').style.display=$('#rbm').style.display=s?'flex':'none'}
$('#rd').onclick=()=>bars($('#rt').style.display==='flex'?0:1);
$('#rx').onclick=()=>{$('#rd').style.display='none';bars(0);io&&io.disconnect();document.body.style.overflow='';save();render();sync()};
const chap=d=>{const m=meta[cur.t],i=cur.ci+d;if(i<0||i>=m.chs.length)return toast(d<0?'Đây là chương đầu':'Đây là chương cuối');if(!pages(cur.t,i)){toast('Chương này cần thêm lại tệp');return}openR(cur.t,i,0);$('#rd').scrollTop=0};
$('#rp').onclick=()=>chap(-1);$('#rn').onclick=()=>chap(1);
$('#rp').textContent='‹ Chương trước';$('#rn').textContent='Chương sau ›';
// ---------- translate
$('#rtr').onclick=async()=>{const sh=$('#sh');sh.style.display='block';
sh.innerHTML='<h3>Dịch trang '+(page+1)+'</h3><p>Đang đọc chữ và dịch…</p>';
try{const s=await claude.use('sample');if(!s)throw{code:'na'};const lim=await s.limits();if(!lim.images)throw{code:'noimg'};
const blob=await (await fetch(pages(cur.t,cur.ci)[page])).blob();
const r=await s(`Đây là một trang truyện tranh. Đọc toàn bộ lời thoại/chữ theo thứ tự đọc (nhận diện mọi ngôn ngữ: Nhật, Hàn, Trung, Anh...). Với mỗi khung chữ, dịch sang tiếng Việt tự nhiên, đúng văn phong truyện. Chỉ trả về danh sách dịch, mỗi dòng một câu thoại, đánh số 1., 2., ... Nếu có hiệu ứng âm thanh thì ghi trong ngoặc (). Nếu trang không có chữ, trả lời "Trang không có chữ".`,{images:[blob],modelTier:'default'});
sh.innerHTML='<h3>Bản dịch · trang '+(page+1)+'</h3><p>'+esc(r.text)+'</p><div class="row"><button class="btn s" id="shx">Đóng</button></div>';
}catch(err){sh.innerHTML='<h3>Chưa dịch được</h3><p>'+(err&&err.code==='not_granted'?'Bạn chưa cho phép trang này dùng Claude.':'Tính năng dịch cần chạy trong Claude và cho phép dùng ảnh.')+'</p><div class="row"><button class="btn s" id="shx">Đóng</button></div>'}
$('#shx').onclick=()=>sh.style.display='none'};

// ---------- MangaDex
const API='https://api.mangadex.org',CR='contentRating[]=safe&contentRating[]=suggestive';
let MD={q:'',lang:'vi',res:null,busy:0,err:0};
async function mj(u){const r=await fetch(API+u);if(!r.ok)throw new Error(r.status);return r.json()}
function mdCard(m){const a=m.attributes,cv=m.relationships.find(r=>r.type==='cover_art');
return{id:m.id,title:a.title.vi||a.title.en||Object.values(a.title)[0]||'?',poster:cv&&cv.attributes?`https://uploads.mangadex.org/covers/${m.id}/${cv.attributes.fileName}.256.jpg`:'',genres:a.tags.filter(t=>t.attributes.group==='genre').map(t=>t.attributes.name.en)}}
async function mdSearch(){MD.busy=1;MD.res=[];MD.err=0;if(tab==='md')render();
try{const u=`/manga?limit=24&includes[]=cover_art&${CR}&availableTranslatedLanguage[]=${MD.lang}&`+(MD.q?`title=${encodeURIComponent(MD.q)}&order[relevance]=desc`:'order[followedCount]=desc');MD.res=(await mj(u)).data.map(mdCard)}catch(e){MD.res=[];MD.err=1}
MD.busy=0;MD.done=1;if(tab==='md')render()}
function mdView(){if(!MD.done&&!MD.busy)setTimeout(mdSearch);
return `<div class="sr"><input id="mq" placeholder="Tìm trên MangaDex (nhấn Enter)..." value="${esc(MD.q)}"></div><div class="chips">${[['vi','Tiếng Việt'],['en','English']].map(([k,l])=>`<button class="${MD.lang===k?'on':''}" data-l="${k}">${l}</button>`).join('')}</div><h2>${MD.q?'Kết quả':'Phổ biến trên MangaDex'}</h2>`+
(MD.busy?'<div class="empty">Đang tải…</div>':MD.err?'<div class="empty">Không kết nối được MangaDex.<br>Hãy mở trang từ hosting riêng hoặc kiểm tra mạng.</div>':MD.res&&MD.res.length?`<div class="grid">${MD.res.map((m,i)=>`<div class="c" data-m="${i}"><div class="im" style="background-image:url('${m.poster}')"></div><div class="t">${esc(m.title)}</div><div class="g">${esc(m.genres.slice(0,2).join(' · '))}</div></div>`).join('')}</div>`:MD.done?'<div class="empty">Không tìm thấy.</div>':'')}
function mdBind(){const i=$('#mq');if(i)i.onkeydown=e=>{if(e.key==='Enter'){MD.q=i.value.trim();mdSearch()}};
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{MD.lang=b.dataset.l;mdSearch()})}
async function mdPages(cid){const d=await mj('/at-home/server/'+cid);return d.chapter.data.map(f=>`${d.baseUrl}/data/${d.chapter.hash}/${f}`)}
async function mdOpen(i){const m=MD.res[i],sh=$('#sh');sh.style.display='block';sh.innerHTML=`<h3>${esc(m.title)}</h3><p>Đang tải danh sách chương…</p>`;
try{const d=(await mj(`/manga/${m.id}/feed?translatedLanguage[]=${MD.lang}&order[chapter]=asc&limit=500&${CR}&includeExternalUrl=0`)).data;
const seen=new Set(),chs=[];for(const c of d){const a=c.attributes;if(!a.pages)continue;const k=a.chapter||c.id;if(seen.has(k))continue;seen.add(k);chs.push({id:c.id,name:'Chương '+(a.chapter||'?')+(a.title?' – '+a.title:'')})}
if(!chs.length){sh.innerHTML=`<h3>${esc(m.title)}</h3><p>Chưa có chương nào trong ngôn ngữ này (có thể truyện chỉ đọc trên web gốc).</p><div class="row"><button class="btn s" id="shx">Đóng</button></div>`;$('#shx').onclick=()=>sh.style.display='none';return}
const lib=()=>{let t=m.title;if(meta[t]&&!(meta[t].md&&meta[t].md.id===m.id))t+=' (MD)';
if(!meta[t])meta[t]={fav:0,ts:0,ch:0,pg:0,genres:m.genres,poster:m.poster,chs:chs.map(c=>c.name),added:Date.now(),md:{id:m.id,lang:MD.lang,cids:chs.map(c=>c.id)}};
else{meta[t].chs=chs.map(c=>c.name);meta[t].md.cids=chs.map(c=>c.id)}save();sync();return t};
sh.innerHTML=`<div class="dt"><div class="im" style="background-image:url('${m.poster}')"></div><div><h3 style="margin:0 0 6px">${esc(m.title)}</h3><div class="g">${esc(m.genres.join(' · '))}</div><div class="g">${chs.length} chương</div><div class="row"><button class="btn" id="mr">▶ Đọc từ đầu</button></div></div></div><div class="row"><button class="btn s" id="ma">＋ Thêm vào thư viện</button><button class="btn s" id="shx">Đóng</button></div><div style="margin-top:10px">${chs.map((c,i)=>`<div class="ch" data-i="${i}"><span>${esc(c.name)}</span></div>`).join('')}</div>`;
$('#shx').onclick=()=>sh.style.display='none';
$('#ma').onclick=()=>{lib();toast('Đã thêm vào thư viện');render()};
$('#mr').onclick=()=>{const t=lib();sh.style.display='none';openR(t,0,0)};
sh.querySelectorAll('.ch').forEach(r=>r.onclick=()=>{const t=lib();sh.style.display='none';openR(t,+r.dataset.i,0)})
}catch(e){sh.innerHTML=`<h3>${esc(m.title)}</h3><p>Không tải được chương. Kiểm tra mạng.</p><div class="row"><button class="btn s" id="shx">Đóng</button></div>`;$('#shx').onclick=()=>sh.style.display='none'}}
// ---------- account & backup
function sheetAcc(){const sh=$('#sh');sh.style.display='block';
sh.innerHTML=user?`<h3>${esc(user.name||'Tài khoản')}</h3><p>Đã đăng nhập. Danh sách truyện, thể loại, yêu thích và tiến độ đọc được sao lưu (không gồm ảnh trang và poster).</p><div class="row"><button class="btn" id="bk">Sao lưu ngay</button><button class="btn s" id="rs">Khôi phục</button><button class="btn s" id="shx">Đóng</button></div>`
:`<h3>Đăng nhập để sao lưu</h3><p>Đăng nhập tài khoản Claude khi mở trang này để lưu danh sách truyện và tiến độ đọc. Nếu chưa thấy, hãy mở trang từ liên kết Claude.</p><div class="row"><button class="btn" id="lg">Đăng nhập</button><button class="btn s" id="shx">Đóng</button></div>`;
$('#shx').onclick=()=>sh.style.display='none';
if($('#lg'))$('#lg').onclick=async()=>{await init();user?sheetAcc():toast('Chưa đăng nhập được')};
if($('#bk'))$('#bk').onclick=async()=>{await sync(1);toast('Đã sao lưu')};
if($('#rs'))$('#rs').onclick=async()=>{await restore();toast('Đã khôi phục')}}
const strip=()=>{const o={};for(const t in meta){const{poster,...r}=meta[t];o[t]=r}return o};
async function sync(f){if(!db||!uid)return;try{await db.collection('data/users/'+uid).doc('backup').set({meta:strip(),t:Date.now()})}catch(e){if(f)toast('Lỗi sao lưu')}}
async function restore(){if(!db||!uid)return;try{const d=await db.collection('data/users/'+uid).doc('backup').get();const v=d&&(d.data?d.data():d);if(v&&v.meta){for(const t in v.meta){const b=v.meta[t];if(!b.chs)continue;meta[t]=Object.assign({},b,meta[t]?{poster:meta[t].poster}:{poster:''})}save();render()}}catch(e){}}
async function init(){try{const u=await claude.use('user');db=await claude.use('db');if(u){uid=await u.id();const me=await u.me();const p=(await u.profiles([uid]))[uid]||{};user={name:p.name||me&&me.name||'Bạn',avatar:p.avatar||p.avatarUrl||''};await restore()}}catch(e){}renderAv()}
render();if(window.claude)init();
</script></body></html>
